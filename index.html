<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Open City Finance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var scheme = 'az.cityfinance.cfapp://open';
      var iosStore = 'https://apps.apple.com/tr/app/city-finance-mobile/id6741097001';
      var androidStore = 'https://play.google.com/store/apps/details?id=com.cityfinance.cfapp';

      function platform() {
        var ua = navigator.userAgent || '';
        if (/iPad|iPhone|iPod/.test(ua)) return 'ios';
        if (/Android/i.test(ua)) return 'android';
        return 'other';
      }

      var redirected = false;
      function goStore() {
        if (redirected) return;
        redirected = true;
        var p = platform();
        window.location.href = p === 'android' ? androidStore : iosStore;
      }

      function openApp() {
        var p = platform();
        var timer = setTimeout(goStore, 1200);

        function onHide() { // app opened → page hidden
          redirected = true;
          clearTimeout(timer);
          document.removeEventListener('visibilitychange', onHide);
        }
        document.addEventListener('visibilitychange', onHide);
        window.addEventListener('pagehide', onHide);

        // Attempt to open app
        window.location.href = scheme;

        // Desktop fallback: go to iOS store by default after 1.2s
        if (p === 'other') setTimeout(goStore, 1300);
      }

      window.addEventListener('load', openApp);
    })();
  </script>
  <style>html,body{height:100%;margin:0;background:#fff;}</style>
</head>
<body></body>
</html>
