<!DOCTYPE html>
<html>
<head>
    <title>City Finance App Launcher</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .button { 
            display: inline-block; 
            padding: 15px 30px; 
            background: #007AFF; 
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            margin: 10px; 
            font-size: 18px;
        }
        .button:hover { background: #0056CC; }
    </style>
</head>
<body>
    <h1>City Finance App</h1>
    
    <a href="az.cityfinance.cfapp://open" class="button">Open App</a>
    <br>
    <a href="az.cityfinance.cfapp://home" class="button">Open Home</a>
    <br>
    <a href="az.cityfinance.cfapp://profile" class="button">Open Profile</a>
    
    <script>
        // Optional: Add fallback detection
        let clicked = false;
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'A' && e.target.href.includes('az.cityfinance.cfapp')) {
                clicked = true;
                setTimeout(function() {
                    if (clicked) {
                        alert('App not installed or failed to open. Please install the app first.');
                    }
                }, 2000);
            }
        });
    </script>
</body>
</html>
