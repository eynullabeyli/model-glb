<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Open City Finance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var iosScheme = 'az.cityfinance.cfapp://open';
      var iosStore  = 'https://apps.apple.com/app/id[YOUR_APP_STORE_ID]';
      var androidScheme = 'az.cityfinance.cfapp://open';
      var androidStore  = 'https://play.google.com/store/apps/details?id=az.cityfinance.cfapp';

      function platform() {
        var ua = navigator.userAgent || '';
        if (/iPad|iPhone|iPod/.test(ua)) return 'ios';
        if (/Android/i.test(ua)) return 'android';
        return 'other';
      }

      var redirected = false;
      function openStore() {
        if (redirected) return;
        redirected = true;
        var p = platform();
        window.location.href = p === 'android' ? androidStore : iosStore;
      }

      function tryOpen(schemeUrl) {
        // If the page becomes hidden, assume success (app opened) and cancel fallback
        var visibilityHandler = function () {
          if (document.hidden) {
            redirected = true;
            clearTimeout(timer);
            document.removeEventListener('visibilitychange', visibilityHandler);
          }
        };
        document.addEventListener('visibilitychange', visibilityHandler);

        // iOS 17+/Safari best-effort: direct navigation
        // Android Chrome also supports this
        var timer = setTimeout(openStore, 1200);
        window.location.href = schemeUrl;

        // Safety: cancel timer if we come back visible and already navigated elsewhere
        window.addEventListener('pagehide', function () {
          redirected = true;
          clearTimeout(timer);
          document.removeEventListener('visibilitychange', visibilityHandler);
        });
      }

      // Kick off immediately on load
      window.addEventListener('load', function () {
        var p = platform();
        if (p === 'android') {
          tryOpen(androidScheme);
        } else {
          tryOpen(iosScheme);
        }
      });
    })();
  </script>
  <style>
    html, body { height: 100%; margin: 0; background:#fff; }
  </style>
</head>
<body></body>
</html>
